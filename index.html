<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📻 Radios Argentinas — Webplayer</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --card-hover: #232838; --border: #2a2f3f;
    --text: #e8eaf0; --muted: #8b90a0; --accent: #4ade80; --playing: #166534;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 120px; }
  header {
    position: sticky; top: 0; z-index: 10; background: rgba(15,17,23,0.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
    padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  header h1 { font-size: 1.15rem; margin-right: auto; white-space: nowrap; }
  header h1 span { color: var(--accent); }
  #count { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type="search"], select {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; outline: none; min-width: 200px;
  }
  input[type="search"]:focus, select:focus { border-color: var(--accent); }
  select { min-width: 150px; cursor: pointer; }
  .btn-release {
    background: var(--card); border: 1px solid var(--accent); color: var(--accent);
    border-radius: 8px; padding: 8px 14px; font-size: 0.9rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.15s, color 0.15s; white-space: nowrap;
  }
  .btn-release:hover { background: var(--accent); color: var(--bg); }
  main { padding: 16px 20px; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .radio {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s;
    display: flex; flex-direction: column; gap: 6px;
  }
  .radio:hover { background: var(--card-hover); transform: translateY(-1px); }
  .radio.playing { background: var(--playing); border-color: var(--accent); }
  .radio .name { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
  .radio .name .eq { display: none; color: var(--accent); font-size: 0.8rem; letter-spacing: 1px; }
  .radio.playing .name .eq { display: inline; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .radio .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
  .radio.playing .meta { color: #b8e6c8; }
  .radio .meta .genre { background: rgba(74,222,128,0.12); color: var(--accent); padding: 1px 8px; border-radius: 20px; font-weight: 500; }
  .radio .meta .br { border: 1px solid var(--border); padding: 1px 7px; border-radius: 20px; }
  .radio .error { color: #f87171; font-size: 0.78rem; display: none; }
  .radio.error .error { display: block; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; grid-column: 1 / -1; }
  #player {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, rgba(26,29,39,0.97), rgba(15,17,23,0.99));
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: grid;
    grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr);
    align-items: center; gap: 16px;
    z-index: 20;
  }
  #player-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  #playBtn {
    width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--accent); background: rgba(74,222,128,0.12);
    color: var(--accent); font-size: 1.2rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
  }
  #playBtn:hover { transform: scale(1.08); background: rgba(74,222,128,0.25); box-shadow: 0 0 18px rgba(74,222,128,0.35); }
  #playBtn.playing { animation: spinGlow 2s ease-in-out infinite; }
  @keyframes spinGlow { 50% { box-shadow: 0 0 24px rgba(74,222,128,0.6); } }
  #now { font-size: 0.85rem; color: var(--muted); min-width: 0; overflow: hidden; }
  #now b { color: var(--text); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #now .playing-flag { color: var(--accent); font-size: 0.78rem; }
  #live {
    display: none; align-items: center; gap: 6px;
    color: #f87171; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
  }
  #live.on { display: inline-flex; }
  #live .dot { width: 8px; height: 8px; border-radius: 50%; background: #f87171; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #viz {
    width: 260px; height: 56px;
    display: block;
  }
  #player-right { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  #vol {
    -webkit-appearance: none; appearance: none;
    width: 100px; height: 4px; border-radius: 4px;
    background: var(--border); outline: none; cursor: pointer;
  }
  #vol::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: none; cursor: pointer;
    transition: transform 0.15s;
  }
  #vol::-webkit-slider-thumb:hover { transform: scale(1.2); }
  #vol::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; }
  .vol-wrap { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 1rem; }
  .hint { color: var(--muted); font-size: 0.7rem; text-align: right; }
  .eq-bars { display: none; align-items: flex-end; gap: 3px; height: 22px; }
  .eq-bars.on { display: flex; }
  .eq-bars span { width: 3px; border-radius: 2px; background: var(--accent); animation: eq 1s ease-in-out infinite; }
  .eq-bars span:nth-child(1) { animation-delay: 0s; } .eq-bars span:nth-child(2) { animation-delay: 0.2s; }
  .eq-bars span:nth-child(3) { animation-delay: 0.4s; } .eq-bars span:nth-child(4) { animation-delay: 0.1s; }
 .eq-bars span:nth-child(5) { animation-delay: 0.3s; }
 @keyframes eq { 0%,100% { height: 4px; } 50% { height: 22px; } }
 .btn-fav {
   background: var(--card); border: 1px solid var(--border); color: var(--muted);
   border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 0.85rem;
   transition: all 0.2s; white-space: nowrap;
 }
 .btn-fav:hover { border-color: var(--accent); color: var(--accent); }
 .btn-fav.active { border-color: var(--accent); color: var(--accent); background: rgba(34,197,94,0.12); }
 .star { cursor: pointer; font-size: 1.05rem; line-height: 1; user-select: none;
         transition: transform 0.15s; }
 .star:hover { transform: scale(1.3); }
 .star.on { filter: drop-shadow(0 0 4px rgba(255,200,0,0.6)); }
 </style>
</head>

</div>

const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const genreEl = document.getElementById('genre');
const countEl = document.getElementById('count');
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const icoPlay = document.getElementById('icoPlay');
const icoPause = document.getElementById('icoPause');

// Alterna entre icono de play y pausa (SVG, mismo estilo).
function setPlayIcon(playing) {
  if (!playBtn) return;
  icoPlay.style.display = playing ? 'none' : '';
  icoPause.style.display = playing ? '' : 'none';
  playBtn.classList.toggle('playing', !!playing);
}
const nowName = document.getElementById('nowName');
const nowGenre = document.getElementById('nowGenre');
const nowSong = document.getElementById('nowSong');
const eqNow = document.getElementById('eqNow');
const liveEl = document.getElementById('live');
const viz = document.getElementById('viz');
const volEl = document.getElementById('vol');
let current = null;
let rafId = null;

// ─── Visualizador de ecualizador (animación pura, sin Web Audio API) ───
// IMPORTANTE: el audio se reproduce SIEMPRE por el <audio> vanilla, sin
// AudioContext. Conectar el elemento a un MediaElementSource redirige la
// salida por el graph de audio y, si el AudioContext está "suspended"
// (política de autoplay del browser), NO se escucha nada — eso rompió el
// player en la v2. El visualizador es animación decorativa: se ve vivo y
// nunca puede afectar la reproducción.
function drawViz() {
  if (!viz || !viz.getContext) return;
  const cv = viz.getContext('2d');
  const W = viz.width, H = viz.height;
  cv.clearRect(0, 0, W, H);

  const bars = 32;
  const gap = 3;
  const bw = (W - gap * (bars - 1)) / bars;
  const playing = !audio.paused && audio.readyState > 2;
  const t = Date.now() / 280;

  for (let i = 0; i < bars; i++) {
    let v = 0;
    if (playing) {
      // ondas superpuestas para un efecto de ecualizador orgánico
      v = 0.28
        + 0.22 * Math.abs(Math.sin(t + i * 0.55))
        + 0.18 * Math.abs(Math.sin(t * 1.7 + i * 0.9))
        + 0.12 * Math.abs(Math.sin(t * 0.6 + i * 0.3));
      if (v > 1) v = 1;
    }
    const h = Math.max(3, v * (H - 4));
    const x = i * (bw + gap);
    const grad = cv.createLinearGradient(0, H, 0, H - h);
    grad.addColorStop(0, '#22c55e');
    grad.addColorStop(1, '#4ade80');
    cv.fillStyle = grad;
    cv.beginPath();
    cv.roundRect ? cv.roundRect(x, H - h, bw, h, 3) : cv.rect(x, H - h, bw, h);
    cv.fill();
  }
  rafId = requestAnimationFrame(drawViz);
}

// ─── Normalización de volumen (EBU R128) ───
// Cada radio trae su gain (dB) medido con ffmpeg. Al reproducir, el volumen
// del usuario se multiplica por el factor de la radio: 10^(gain/20).
// Así las radios fuertes bajan y las débiles suben al mismo nivel percibido.
function gainFactor(r) {
  const g = r && r.g ? r.g : 0;
  return Math.pow(10, g / 20);
}

// ─── Reproducción (100% vanilla, como el player original) ───
function play(r, el) {
  document.querySelectorAll('.radio.playing').forEach(x => x.classList.remove('playing'));
  document.querySelectorAll('.radio.error').forEach(x => x.classList.remove('error'));
  current = r;
  if (el) el.classList.add('playing');

  audio.src = streamUrl(r.url);
  audio.volume = Math.min(1, parseFloat(volEl.value) * gainFactor(r));
  audio.play().catch(() => { if (el) el.classList.add('error'); });

  setPlayIcon(true);
  liveEl.classList.add('on');
  eqNow.classList.add('on');
  nowName.textContent = r.name;
  nowGenre.textContent = r.genre;
  nowSong.textContent = '';
  if (!rafId) drawViz();
  startSongPoll(r);
}

// ─── Now playing (canción actual) ───
// Solo algunas radios (m=1) tienen /status-json.xsl (Icecast) en su dominio con
// CORS. Consultamos cada 20s y mostramos el título bajo el nombre de la radio.
let songTimer = null;
let songRadio = null;

function songStatusURL(url, endpoint) {
  try {
    const u = new URL(url);
    if (endpoint === 'scs') {
      u.pathname = '/stats';
      u.search = 'sid=1&json=1';
      u.hash = '';
      return u.href;
    }
    if (endpoint === 'sc7') {
      u.pathname = '/7.html';
      u.search = '';
      u.hash = '';
      return u.href;
    }
    u.pathname = '/status-json.xsl';
    u.search = '';
    u.hash = '';
    return u.href;
  } catch (e) { return null; }
}

// Extrae el título según el formato del endpoint.
function extractSongTitle(data, endpoint) {
  if (!data) return '';
  if (endpoint === 'scs') {
    const t = (data.songtitle || '').trim();
    return t;
  }
  if (endpoint === 'sc7') {
    // formato: <html><body>oyentes,status,pico,max,bitrate,CANCION</body></html>
    const m = String(data).match(/<body>([^<]+)<\/body>/);
    if (!m) return '';
    const parts = m[1].trim().split(',');
    return parts.length >= 6 ? parts.slice(5).join(',').trim() : '';
  }
  // ice: icestats.source[].title
  const src = data.icestats && data.icestats.source;
  const list = Array.isArray(src) ? src : (src ? [src] : []);
  for (const s of list) {
    const t = (s.title || '').trim();
    if (t) return t;
  }
  return '';
}

function startSongPoll(r) {
  stopSongPoll();
  songRadio = r;
  if (!r.m) { nowSong.textContent = ''; return; }
  const statusURL = songStatusURL(r.url, r.e);
  if (!statusURL) { nowSong.textContent = ''; return; }
  const tick = () => {
    if (!songRadio || !songRadio.m) return;
    fetch(statusURL, { cache: 'no-store' })
      .then(res => res.ok ? res.text() : null)
      .then(text => {
        if (!text || !songRadio) return;
        let data = text;
        try { data = JSON.parse(text); } catch (e) { /* 7.html no es JSON */ }
        const title = extractSongTitle(data, songRadio.e);
        if (title && !/^Ads?[ 	]*-?[ 	]*Block$/i.test(title) && !/^radio$/i.test(title)) {
          nowSong.textContent = '🎵 ' + title;
        } else {
          nowSong.textContent = '';
        }
      })
      .catch(() => {});
  };
  tick();
  songTimer = setInterval(tick, 20000);
}

function stopSongPoll() {
  if (songTimer) { clearInterval(songTimer); songTimer = null; }
  songRadio = null;
}

playBtn.addEventListener('click', () => {
  if (!current) return;
  if (audio.paused) {
    audio.play().catch(() => {});
    setPlayIcon(true);
    liveEl.classList.add('on');
    eqNow.classList.add('on');
  } else {
    audio.pause();
    setPlayIcon(false);
    liveEl.classList.remove('on');
    eqNow.classList.remove('on');
  }
});

volEl.addEventListener('input', () => {
  audio.volume = Math.min(1, parseFloat(volEl.value) * gainFactor(current));
});

audio.addEventListener('error', () => {
  // fallback: si intentamos https y falló, probar con la URL original
  if (current && audio.src.startsWith('https://') && current.url.startsWith('http://')) {
    audio.src = current.url;
    audio.play().catch(() => {});
    return;
  }
  if (current) {
    const el = [...document.querySelectorAll('.radio')].find(x =>
      x.querySelector('.name')?.textContent.includes(current.name));
    if (el) el.classList.add('error');
  }
  setPlayIcon(false);
  liveEl.classList.remove('on');
  eqNow.classList.remove('on');
});

audio.addEventListener('playing', () => {
  setPlayIcon(true);
  liveEl.classList.add('on');
  eqNow.classList.add('on');
});

// En GitHub Pages (https) los streams http:// se bloquean como mixed content →
// intentamos https:// primero y caemos a http:// si falla.
function streamUrl(url) {
  if (location.protocol === 'https:' && url.startsWith('http://')) {
    return 'https://' + url.slice(7);
  }
  return url;
}

const genres = [...new Set(RADIOS.map(r => r.genre))].sort();
for (const g of genres) {
  const opt = document.createElement('option');
  opt.value = g; opt.textContent = g;
  genreEl.appendChild(opt);
}

// ─── Favoritas (localStorage) ───
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem('radios-favs') || '[]')); } catch (e) {}
let favOnly = false;
const favToggleEl = document.getElementById('favToggle');

function saveFavs() {
  try { localStorage.setItem('radios-favs', JSON.stringify([...favs])); } catch (e) {}
}
function toggleFav(url) {
  if (favs.has(url)) favs.delete(url); else favs.add(url);
  saveFavs();
  if (favToggleEl) favToggleEl.classList.toggle('active', favOnly && favs.size > 0);
  render();
}
if (favToggleEl) favToggleEl.addEventListener('click', () => {
  favOnly = !favOnly;
  favToggleEl.classList.toggle('active', favOnly);
  render();
});

function filtered() {
  const q = searchEl.value.trim().toLowerCase();
  const g = genreEl.value;
  return RADIOS.filter(r => {
    if (favOnly && !favs.has(r.url)) return false;
    if (g && r.genre !== g) return false;
    if (!q) return true;
    return r.name.toLowerCase().includes(q) || r.genre.toLowerCase().includes(q);
  });
}

function render() {
  const list = filtered();
  countEl.textContent = list.length + ' / ' + RADIOS.length + ' radios';
  listEl.innerHTML = '';
  if (list.length === 0) {
    listEl.innerHTML = '<div class="empty">' + (favOnly ? 'Sin favoritas — tocá ⭐ en una radio' : 'Sin resultados 😕') + '</div>';
    return;
  }
  for (const r of list) {
    const div = document.createElement('div');
    div.className = 'radio' + (current && current.url === r.url ? ' playing' : '');
    const isFav = favs.has(r.url);
    div.innerHTML = `
      <div class="name"><span class="star${isFav ? ' on' : ''}" title="Favorita">${isFav ? '⭐' : '☆'}</span><span class="eq">♪♪</span>${esc(r.name)}</div>
      <div class="meta">
        <span class="genre">${esc(r.genre)}</span>
        <span class="br">${r.bitrate > 0 ? r.bitrate + ' kbps' : 'auto'}</span>
        <span>${esc(r.country)}</span>
      </div>
      <div class="error">⚠️ No se pudo reproducir — probá otra</div>`;
    div.addEventListener('click', (ev) => {
      if (ev.target.classList.contains('star')) { toggleFav(r.url); return; }
      play(r, div);
    });
    listEl.appendChild(div);
  }
}

searchEl.addEventListener('input', render);
genreEl.addEventListener('change', render);

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

render();
</script>
